name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          set -e
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare source
        run: |
          set -e
          ls -la
          if [ ! -d VocabShock ]; then unzip -o VocabShock.zip; fi
          cd VocabShock
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      - name: Build
        run: |
          set -e
          cd VocabShock
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/g.zip
          mkdir -p "$HOME/gradle"
          unzip -q -o /tmp/g.zip -d "$HOME/gradle"
          "$HOME/gradle/gradle-8.2/bin/gradle" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VocabShock-debug
          path: VocabShock/app/build/outputs/apk/debug/app-debug.apk
